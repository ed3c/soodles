name: Executable Issue
description: One causal correction with an externally admitted execution boundary.
body:
  - type: markdown
    attributes:
      value: |
        Fill the contract with concrete behavior and evidence. The entire Issue body is revision-bound.
        This form does not authorize execution; the supervisor separately selects the envelope.
        A whole atom enters poteto-mode. Its playbook uses these sections together.
        State unknown inputs explicitly. Reference evidence once instead of copying it across sections.
  - type: textarea
    id: problem
    attributes:
      label: Problem & Evidence
      description: State the observed problem and link its evidence. Separate observations from suspected causes.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome & Scope
      description: State the required result, included work and exclusions. For a finite subtask, state its output and stopping point.
  - type: textarea
    id: context
    attributes:
      label: Context & Entry Points
      description: Identify the repository, selected revision, relevant source and product entry. Link any selected verification recipe.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: State observable success and failure conditions. Link matching existing evidence and name missing observations.
  - type: textarea
    id: boundaries
    attributes:
      label: Execution Boundaries
      description: Identify the writer and later owners, allowed effects, file boundary and stopping point. Keep these consistent with the admitted contract.
  - type: textarea
    id: delivery
    attributes:
      label: Delivery & Evidence
      description: Identify any existing candidate or PR, its evidence and remaining owner work. State the requested final delivery.
  - type: textarea
    id: contract
    attributes:
      label: Execution contract
      description: Keep one marked JSON block. File paths are exact repository-relative names. Schema 3 remains the ordinary route; schema 4 adds an externally selected comparison as described in contracts/system-v1.md. The supervisor supplies its pins.
      value: |
        <!-- soodles:execution-v1 -->
        ```json
        {
          "schema": 3,
          "trigger": "",
          "source": "",
          "owner": "",
          "changes": [],
          "write_paths": [],
          "required_paths": [],
          "evidence_manifest": "",
          "base_head": "",
          "frozen_paths": [],
          "behavior": [],
          "defect_controls": [],
          "non_cases": [],
          "dependencies": [],
          "acceptance": "",
          "delivery": "One Issue, one PR, one terminal candidate; preserve failed heads as immutable attempts on that PR.",
          "reconciliation": "",
          "feature_scope": ""
        }
        ```
        <!-- /soodles:execution-v1 -->
    validations:
      required: true

name: Executable Issue
description: One causal correction with an externally admitted execution boundary.
body:
  - type: markdown
    attributes:
      value: |
        Fill the contract with concrete behavior and evidence. The entire Issue body is revision-bound.
        This form does not authorize execution; the supervisor separately selects the envelope.
  - type: textarea
    id: contract
    attributes:
      label: Execution contract
      description: Keep one marked JSON block. File paths are exact repository-relative names.
      value: |
        <!-- soodles:execution-v1 -->
        ```json
        {
          "schema": 2,
          "trigger": "",
          "source": "",
          "owner": "",
          "changes": [],
          "write_paths": [],
          "required_paths": [],
          "evidence_manifest": "",
          "behavior": [],
          "defect_controls": [],
          "non_cases": [],
          "dependencies": [],
          "acceptance": "",
          "delivery": "",
          "reconciliation": "",
          "feature_scope": ""
        }
        ```
        <!-- /soodles:execution-v1 -->
    validations:
      required: true

name: merge-readback-fixed-oracle
on:
  push:
    branches: [soodles-29-proof]
permissions:
  contents: read
jobs:
  merge-readback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout supervisor-selected immutable experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - name: Checkout exact baseline as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 11a2298d0ba3c5d80fecb00ccc554e38ef3268fe
          path: baseline
          persist-credentials: false
      - name: Checkout exact candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e3683a7c8b8f1f1c79c573d9d4422a85922bfb51
          path: candidate
          persist-credentials: false
      - name: Run fixed observer with isolated subjects and planted negative
        run: sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA python3 -B authority/authority/proof_runner.py
      - name: Preserve external evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-readback-fixed-oracle
          path: /tmp/soodles-29-proof/result.json
          if-no-files-found: error
          retention-days: 30

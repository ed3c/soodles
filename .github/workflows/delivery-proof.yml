name: delivery-fixed-oracle
on:
  push:
    branches: [soodles-10-proof]
permissions:
  contents: read
jobs:
  delivery-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout supervisor-selected immutable experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - name: Checkout exact baseline as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ca3bfffb4b4da6dad1c969723043e62099eb0ef1
          path: baseline
          persist-credentials: false
      - name: Checkout exact candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc83bc30ab78409a6e767a2777b58ec5714892e4
          path: candidate
          persist-credentials: false
      - name: Run fixed oracle with isolated children and planted negative
        run: sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA python3 -B authority/authority/proof_runner.py
      - name: Preserve external evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-fixed-oracle
          path: /tmp/soodles-10-proof/result.json
          if-no-files-found: error
          retention-days: 30

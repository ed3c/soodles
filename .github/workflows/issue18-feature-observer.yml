name: issue18-feature-observer
on:
  push:
    branches: [codex/evidence-18-feature-observer-20260917]
permissions:
  contents: read
  actions: read
jobs:
  feature-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9897938501787b83dd681131325bceed6eb6d3e6
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read release identity and verify archive and binary before execution
        run: |
          python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          import soodles
          lock = soodles.load_lock(pathlib.Path.cwd())
          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'soodles-runtime-bootstrap'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()
          api = 'https://api.github.com/repos/' + lock['repository']
          release = json.loads(fetch(api + '/releases/tags/' + lock['release']))
          commit = json.loads(fetch(api + '/commits/' + lock['release']))
          assert release['tag_name'] == lock['release']
          assert commit['sha'] == lock['commit'], 'release commit differs from lock'
          assets = [a for a in release['assets'] if a['name'] == lock['asset_name']]
          assert len(assets) == 1, 'release asset is absent or ambiguous'
          assert assets[0]['digest'] == 'sha256:' + lock['asset_sha256']
          url = 'https://github.com/' + lock['repository'] + '/releases/download/' + lock['release'] + '/' + lock['asset_name']
          archive = fetch(url)
          assert hashlib.sha256(archive).hexdigest() == lock['asset_sha256'], 'archive digest differs'
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              members = [m for m in tar.getmembers() if m.name == 'noodle' and m.isfile()]
              assert len(members) == 1, 'binary member is absent or ambiguous'
              binary = tar.extractfile(members[0]).read()
          assert hashlib.sha256(binary).hexdigest() == lock['binary_sha256'], 'binary digest differs'
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'soodles-runtime'
          directory.mkdir()
          target = directory / 'noodle'
          target.write_bytes(binary)
          target.chmod(0o755)
          receipt = {'release': release['tag_name'], 'commit': commit['sha'], 'asset': assets[0]['name'],
                     'archive_sha256': lock['asset_sha256'], 'binary_sha256': lock['binary_sha256'],
                     'authorizes_landing': False}
          (directory / 'release.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - name: Drive mapped runtime admission on the fixed subject
        run: |
          python3 -B .agents/skills/verify-soodles/scripts/verify_runtime.py "$RUNNER_TEMP/soodles-runtime/noodle" "$RUNNER_TEMP/runtime-feature"
      - name: Read prior exact-head acceptance and preserve observations in provider logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PYCODE'
          import os,json,urllib.request,zipfile,io,base64,zlib
          from pathlib import Path
          base='https://api.github.com/repos/ed3c/soodles'
          def get(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return urllib.request.urlopen(request,timeout=60).read()
          items=json.loads(get(base+'/actions/runs/35126642434/artifacts'))['artifacts']
          matches=[a for a in items if a['name']=='runtime-evidence-9897938501787b83dd681131325bceed6eb6d3e6']
          assert len(matches)==1
          data=get(matches[0]['archive_download_url'])
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              acceptance=json.loads(archive.read('acceptance.json'))
              release=json.loads(archive.read('release.json'))
          assert acceptance['candidate']['head']=='9897938501787b83dd681131325bceed6eb6d3e6'
          runtime=json.loads((Path(os.environ['RUNNER_TEMP'])/'runtime-feature/receipt.json').read_text())
          assert runtime['classification']=='VERIFIED'
          report={'scope':'Mapped runtime CLI live drive plus readback of existing exact-head acceptance; no new canonical acceptance invocation or live provider delivery','runtime_feature':runtime,'acceptance':acceptance,'release':release,'artifact_id':matches[0]['id'],'authorizes_landing':False}
          print('SOODLES_FEATURE_OBSERVER_ZLIB_BASE64='+base64.b64encode(zlib.compress(json.dumps(report).encode())).decode())
          PYCODE

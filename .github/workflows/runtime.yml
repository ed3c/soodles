name: runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact candidate evidence from fresh Issue readback
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/soodles-cache
        run: |
          mkdir -p "$RUNNER_TEMP/soodles-runtime"
          issue="$(python3 - <<'PY'
          import os, re
          matches = re.findall(r'(?mi)^Refs #([1-9][0-9]*)\.?\s*$', os.environ.get('PR_BODY', ''))
          if len(matches) != 1:
              raise SystemExit('PR body must contain exactly one `Refs #N` line')
          print(matches[0])
          PY
          )"
          ./soodles github issue "$issue" > "$RUNNER_TEMP/soodles-runtime/issue-readback.json"
          ./soodles candidate verify "$RUNNER_TEMP/soodles-runtime/issue-readback.json" "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/soodles-runtime/candidate-evidence.json"

      - name: Read release identity and verify archive and binary before execution
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          import soodles
          lock = soodles.load_lock(pathlib.Path.cwd())
          def fetch(url, authenticated=False):
              headers = {'User-Agent': 'soodles-runtime-bootstrap'}
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + os.environ['GITHUB_API_TOKEN']
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()
          api = 'https://api.github.com/repos/' + lock['repository']
          release = json.loads(fetch(api + '/releases/tags/' + lock['release'], authenticated=True))
          commit = json.loads(fetch(api + '/commits/' + lock['release'], authenticated=True))
          assert release['tag_name'] == lock['release']
          assert commit['sha'] == lock['commit'], 'release commit differs from lock'
          assets = [a for a in release['assets'] if a['name'] == lock['asset_name']]
          assert len(assets) == 1, 'release asset is absent or ambiguous'
          assert assets[0]['digest'] == 'sha256:' + lock['asset_sha256']
          url = 'https://github.com/' + lock['repository'] + '/releases/download/' + lock['release'] + '/' + lock['asset_name']
          archive = fetch(url)
          assert hashlib.sha256(archive).hexdigest() == lock['asset_sha256'], 'archive digest differs'
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              members = [m for m in tar.getmembers() if m.name == 'noodle' and m.isfile()]
              assert len(members) == 1, 'binary member is absent or ambiguous'
              binary = tar.extractfile(members[0]).read()
          assert hashlib.sha256(binary).hexdigest() == lock['binary_sha256'], 'binary digest differs'
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'soodles-runtime'
          directory.mkdir(exist_ok=True)
          target = directory / 'noodle'
          target.write_bytes(binary)
          target.chmod(0o755)
          receipt = {'release': release['tag_name'], 'commit': commit['sha'], 'asset': assets[0]['name'],
                     'archive_sha256': lock['asset_sha256'], 'binary_sha256': lock['binary_sha256'],
                     'authorizes_landing': False}
          (directory / 'release.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - name: Canonical acceptance on the exact candidate head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          ./soodles acceptance verify "$RUNNER_TEMP/soodles-runtime/noodle" > "$RUNNER_TEMP/soodles-runtime/acceptance.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({"candidate":r["candidate"],"zero_residue":r["physical"]["zero_residue"],"authorizes_landing":r["authorizes_landing"]}))' "$RUNNER_TEMP/soodles-runtime/acceptance.json"

      - name: Build exact admission-recovery subject and preserve observer processes
        env:
          GOTOOLCHAIN: go1.26.1
        run: |
          subject="$RUNNER_TEMP/noodle-admission-source"
          git init "$subject"
          git -C "$subject" remote add origin https://github.com/ed3c/noodle.git
          git -C "$subject" fetch --depth=1 origin ca81f942f478e8e4afcbbce6ca69640867efe753
          git -C "$subject" checkout --detach FETCH_HEAD
          test "$(git -C "$subject" rev-parse HEAD)" = ca81f942f478e8e4afcbbce6ca69640867efe753
          (cd "$subject" && corepack pnpm install --frozen-lockfile)
          (cd "$subject" && corepack pnpm --filter noodle-ui build)
          (cd "$subject" && go build -o "$RUNNER_TEMP/noodle-admission" .)
          go version -m "$RUNNER_TEMP/noodle-admission" > "$RUNNER_TEMP/noodle-build.txt"
          ./soodles packet observe "$RUNNER_TEMP/noodle-admission" "$subject" "$RUNNER_TEMP/admission-packet" --build-info "$RUNNER_TEMP/noodle-build.txt"
          ./soodles packet create "$RUNNER_TEMP/admission-packet" "$RUNNER_TEMP/soodles-runtime/admission-recovery.tar" --carrier linux_amd64
          ./soodles packet verify "$RUNNER_TEMP/soodles-runtime/admission-recovery.tar" --expected-carrier linux_amd64
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'admission-packet'
          for label, expected_exit in (('recovery', 0), ('refusal', 0)):
              process = json.loads((root / label / 'process.json').read_text())
              assert process['exit_code'] == expected_exit and process['waited'] and not process['timed_out'], (label, process)
          PYTHON

      - name: Preserve non-authorizing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/soodles-runtime/*.json
            ${{ runner.temp }}/soodles-runtime/admission-recovery.tar
          if-no-files-found: error
          retention-days: 30

name: runtime

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Exact base commit SHA for requested verification of the selected ref'
        required: true
        type: string
      reason:
        description: 'Behavior requiring additional verification'
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: runtime-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact candidate evidence from fresh Issue readback
        id: candidate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/soodles-cache
        run: |
          mkdir -p "$RUNNER_TEMP/soodles-runtime"
          issue="$(python3 - <<'PY'
          import os, re
          matches = re.findall(r'(?mi)^Refs (?:ed3c/soodles)?#([1-9][0-9]*)\.?\s*$', os.environ.get('PR_BODY', ''))
          if len(matches) != 1:
              raise SystemExit('PR body must contain exactly one local `Refs #N` or `Refs ed3c/soodles#N` line')
          print(matches[0])
          PY
          )"
          ./soodles github issue ed3c/soodles "$issue" > "$RUNNER_TEMP/soodles-runtime/issue-readback.json"
          python3 -B - "$issue" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from issue_admission import AdmissionRefusal
          from runtime_candidate import verify_pull_request
          directory = Path(os.environ['RUNNER_TEMP']) / 'soodles-runtime'
          output = directory / 'candidate-evidence.json'
          try:
              receipt = verify_pull_request(
                  Path.cwd(), os.environ['BASE_SHA'], os.environ['HEAD_SHA'],
                  json.loads((directory / 'issue-readback.json').read_text()),
                  issue_number=int(sys.argv[1]), repository='ed3c/soodles')
          except (AdmissionRefusal, OSError, ValueError, TypeError, KeyError, subprocess.TimeoutExpired) as error:
              receipt = {
                  'owner': 'candidate.verify', 'status': 'refused',
                  'invalid': getattr(error, 'invalid', {'field': 'input', 'value': str(error)}),
                  'next': getattr(error, 'next', {
                      'kind': 'input', 'owner': 'supervisor', 'required': ['valid_candidate_evidence']}),
                  'authorizes_landing': False,
              }
              if getattr(error, 'comparison', None) is not None:
                  receipt['comparison'] = error.comparison
              output.write_text(json.dumps(receipt, indent=2) + '\n')
              print('REFUSED: runtime candidate: ' + str(error), file=sys.stderr)
              raise SystemExit(1)
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('base=' + receipt['base_head'] + '\n')
          PY

      - name: Request verification scope from Test Manager
        id: scope
        env:
          VERIFIED_PR_BASE: ${{ steps.candidate.outputs.base }}
          DISPATCH_BASE: ${{ inputs.base }}
          REQUEST_REASON: ${{ inputs.reason }}
        run: |
          mkdir -p "$RUNNER_TEMP/soodles-runtime"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from test_manager import ci_request, plan, require_ready
          event = os.environ['GITHUB_EVENT_NAME']
          base = (os.environ.get('VERIFIED_PR_BASE', '') if event == 'pull_request'
                  else os.environ.get('DISPATCH_BASE', ''))
          request = ci_request('runtime', event, base, os.environ.get('REQUEST_REASON'))
          base = request['base']
          selection = plan(Path.cwd(), base, require_base=True)
          selection['request'] = request
          output = Path(os.environ['RUNNER_TEMP']) / 'soodles-runtime/selection.json'
          output.write_text(json.dumps(selection, indent=2) + '\n')
          print(json.dumps(selection))
          require_ready(selection)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('base=' + base + '\n')
              stream.write('physical=' + str(bool(selection['physical'])).lower() + '\n')
          PY

      - name: Prepare runtime only when requested by Test Manager
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          PHYSICAL_REQUIRED: ${{ steps.scope.outputs.physical }}
        run: |
          if [ "$PHYSICAL_REQUIRED" = 'false' ]; then
            echo 'Test Manager requested no physical controls; no runtime download or execution required.'
            exit 0
          fi
          test "$PHYSICAL_REQUIRED" = 'true'
          python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          import soodles
          lock = soodles.load_lock(pathlib.Path.cwd())
          def fetch(url, authenticated=False):
              headers = {'User-Agent': 'soodles-runtime-bootstrap'}
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + os.environ['GITHUB_API_TOKEN']
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()
          api = 'https://api.github.com/repos/' + lock['repository']
          release = json.loads(fetch(api + '/releases/tags/' + lock['release'], authenticated=True))
          commit = json.loads(fetch(api + '/commits/' + lock['release'], authenticated=True))
          assert release['tag_name'] == lock['release']
          assert commit['sha'] == lock['commit'], 'release commit differs from lock'
          assets = [a for a in release['assets'] if a['name'] == lock['asset_name']]
          assert len(assets) == 1, 'release asset is absent or ambiguous'
          assert assets[0]['digest'] == 'sha256:' + lock['asset_sha256']
          url = 'https://github.com/' + lock['repository'] + '/releases/download/' + lock['release'] + '/' + lock['asset_name']
          archive = fetch(url)
          assert hashlib.sha256(archive).hexdigest() == lock['asset_sha256'], 'archive digest differs'
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              members = [m for m in tar.getmembers() if m.name == 'noodle' and m.isfile()]
              assert len(members) == 1, 'binary member is absent or ambiguous'
              binary = tar.extractfile(members[0]).read()
          assert hashlib.sha256(binary).hexdigest() == lock['binary_sha256'], 'binary digest differs'
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'soodles-runtime'
          directory.mkdir(exist_ok=True)
          target = directory / 'noodle'
          target.write_bytes(binary)
          target.chmod(0o755)
          receipt = {'release': release['tag_name'], 'commit': commit['sha'], 'asset': assets[0]['name'],
                     'archive_sha256': lock['asset_sha256'], 'binary_sha256': lock['binary_sha256'],
                     'authorizes_landing': False}
          (directory / 'release.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - name: Canonical acceptance on the exact candidate head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ steps.scope.outputs.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          args=()
          if [ -n "$BASE_SHA" ]; then args=(--base "$BASE_SHA"); fi
          ./soodles acceptance verify "$RUNNER_TEMP/soodles-runtime/noodle" "${args[@]}" > "$RUNNER_TEMP/soodles-runtime/acceptance.json" 2> >(tee "$RUNNER_TEMP/soodles-runtime/acceptance.log" >&2)
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({"candidate":r["candidate"],"selection":r["selection"],"zero_residue":r["physical"].get("zero_residue"),"authorizes_landing":r["authorizes_landing"]}))' "$RUNNER_TEMP/soodles-runtime/acceptance.json"

      - name: Preserve non-authorizing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/soodles-runtime/*.json
            ${{ runner.temp }}/soodles-runtime/*.log
          if-no-files-found: error
          retention-days: 30

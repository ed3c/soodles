name: quality-cost-bootstrap-proof
'on':
  push:
    branches:
    - soodles-12-cost-proof
permissions:
  contents: read
  actions: read
jobs:
  completed-runtime-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - name: Checkout immutable read-only cost collector
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: f2b78f2b6e216bb1fdaccef1c7b5e0ce9f500b66
        sparse-checkout: quality/provider.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Read completed runtime cost without executing the subject
      env:
        GH_TOKEN: ${{ github.token }}
        SUBJECT_HEAD: 9726714de8d5a808273c172050c7f8da841f3cc1
        SUBJECT_RUN: '35045642081'
        SUBJECT_ATTEMPT: '1'
      run: "python3 -B - <<'PY'\nimport json,os,pathlib,re,sys\nsys.path.insert(0, 'quality')\nfrom provider import collect\n\
        head=os.environ['SUBJECT_HEAD']\nassert re.fullmatch('[0-9a-f]{40}',head), 'invalid event head'\nreport=collect(head)\n\
        report['trigger']={'run_id':int(os.environ['SUBJECT_RUN']), 'attempt':int(os.environ['SUBJECT_ATTEMPT'])}\nreport['collector_commit']='f2b78f2b6e216bb1fdaccef1c7b5e0ce9f500b66'\n\
        runs=[r for r in report['runs'] if r['id']==report['trigger']['run_id'] and r['attempt']==report['trigger']['attempt']]\n\
        if len(runs)!=1 or runs[0]['status']!='completed':\n    report['status']='unavailable'\n    report['reason']='Exact\
        \ completed trigger absent in bounded readback; no retry'\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-cost.json'\n\
        out.write_text(json.dumps(report,indent=2)+'\\n')\nlines=['## Completed runtime cost', '', 'Head `'+head+'`; observation:\
        \ '+report['status']+'.', '', '| Job | Seconds | Result |', '|---|---:|---|']\nfor run in runs:\n    for job in run['jobs']:\n\
        \        lines.append(f\"| {job['name']} | {job['seconds']} | {job['conclusion']} |\")\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as stream:\n    stream.write('\\n'.join(lines)+'\\n')\nprint(json.dumps({'status':report['status'],'trigger':report['trigger'],'runs':[{'id':r['id'],'jobs':r['jobs']}\
        \ for r in runs]}))\nPY\n"
    - name: Preserve completed cost readback
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: quality-cost-bootstrap-9726714d
        path: ${{ runner.temp }}/quality-cost.json
        if-no-files-found: error
        retention-days: 30

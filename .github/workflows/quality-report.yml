name: quality-report
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned measurement recipe
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-env"
          "$RUNNER_TEMP/quality-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --report "$RUNNER_TEMP/quality-install.json" -r quality/requirements.txt
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-install.json').read_text())
          package=next(x for x in report['install'] if x['metadata']['name']=='scb-check')
          assert package['download_info']['archive_info']['hashes']['sha256']=='f13040c8ca8f57b8dc8137692c37e0f181fe55867691dfe6a5b8a79d2513f50f'
          PY
      - name: Measure all scopes with one entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/quality-env/bin/python" -B quality/measure.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/quality-report"
      - name: Preserve observations and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-report/
            ${{ runner.temp }}/quality-install.json
          if-no-files-found: error
          retention-days: 30

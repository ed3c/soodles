name: quality-report-observation
on:
  push:
    branches: [soodles-quality-817a603b]
    paths:
      - '.github/workflows/quality-report.yml'
      - 'quality/measure.py'
      - 'quality/requirements.txt'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixed measurement implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: measurement
          persist-credentials: false
      - name: Checkout exact measured head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 817a603bd85cafeb6048aa5a5a830566b9d88a1e
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed analyzer and dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-env"
          mkdir -p "$RUNNER_TEMP/quality-report"
          "$RUNNER_TEMP/quality-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --report "$RUNNER_TEMP/quality-report/install.json" -r measurement/quality/requirements.txt
          "$RUNNER_TEMP/quality-env/bin/python" - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-report/install.json').read_text())
          package=next(x for x in report['install'] if x['metadata']['name']=='scb-check')
          assert package['download_info']['archive_info']['hashes']['sha256']=='f13040c8ca8f57b8dc8137692c37e0f181fe55867691dfe6a5b8a79d2513f50f'
          PY
      - name: Verify measurement controls and report exact base versus head
        run: |
          "$RUNNER_TEMP/quality-env/bin/python" measurement/quality/measure.py "$GITHUB_WORKSPACE/subject" "$RUNNER_TEMP/quality-report"
      - name: Preserve report and raw locations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soodles-quality-ca3bfffb-to-817a603b
          path: ${{ runner.temp }}/quality-report/
          if-no-files-found: error
          retention-days: 30

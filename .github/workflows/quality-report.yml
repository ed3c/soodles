name: quality-report
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Exact base commit SHA to compare with the selected ref'
        required: true
        type: string
      reason:
        description: 'Question this full-repository observation will answer'
        required: true
        type: string
  workflow_run:
    workflows: [runtime]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-report-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || 1 }}
  cancel-in-progress: true
jobs:
  observation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Admit requested observation through Test Manager
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ github.sha }}
          REQUEST_REASON: ${{ inputs.reason }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from test_manager import ci_request
          from quality.measure import preflight, git
          request = ci_request('quality', os.environ['GITHUB_EVENT_NAME'], os.environ['BASE_SHA'], os.environ['REQUEST_REASON'])
          root = Path.cwd()
          assert git(root, 'rev-parse', 'HEAD').decode().strip() == os.environ['HEAD_SHA']
          preflight(root, request['base'], os.environ['HEAD_SHA'], Path(os.environ['RUNNER_TEMP']) / 'quality-report')
          request['head'] = os.environ['HEAD_SHA']
          (Path(os.environ['RUNNER_TEMP']) / 'quality-request.json').write_text(json.dumps(request, indent=2) + '\n')
          print(json.dumps(request))
          PY
      - name: Install pinned measurement recipe
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-env"
          "$RUNNER_TEMP/quality-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --report "$RUNNER_TEMP/quality-install.json" -r quality/requirements.txt
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-install.json').read_text())
          package=next(x for x in report['install'] if x['metadata']['name']=='scb-check')
          assert package['download_info']['archive_info']['hashes']['sha256']=='f13040c8ca8f57b8dc8137692c37e0f181fe55867691dfe6a5b8a79d2513f50f'
          PY
      - name: Measure all scopes with one entry
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/quality-env/bin/python" -B quality/measure.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/quality-report"
      - name: Preserve observations and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-report/
            ${{ runner.temp }}/quality-install.json
            ${{ runner.temp }}/quality-request.json
          if-no-files-found: error
          retention-days: 30
  completed-runtime-cost:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout immutable read-only cost collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2b78f2b6e216bb1fdaccef1c7b5e0ce9f500b66
          sparse-checkout: quality/provider.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read completed runtime cost without executing the subject
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_HEAD: ${{ github.event.workflow_run.head_sha }}
          SUBJECT_RUN: ${{ github.event.workflow_run.id }}
          SUBJECT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 -B - <<'PY'
          import json,os,pathlib,re,sys
          sys.path.insert(0, 'quality')
          from provider import collect
          head=os.environ['SUBJECT_HEAD']
          assert re.fullmatch('[0-9a-f]{40}',head), 'invalid event head'
          report=collect(head)
          report['trigger']={'run_id':int(os.environ['SUBJECT_RUN']), 'attempt':int(os.environ['SUBJECT_ATTEMPT'])}
          report['collector_commit']='f2b78f2b6e216bb1fdaccef1c7b5e0ce9f500b66'
          runs=[r for r in report['runs'] if r['id']==report['trigger']['run_id'] and r['attempt']==report['trigger']['attempt']]
          if len(runs)!=1 or runs[0]['status']!='completed':
              report['status']='unavailable'
              report['reason']='Exact completed trigger absent in bounded readback; no retry'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-cost.json'
          out.write_text(json.dumps(report,indent=2)+'\n')
          lines=['## Completed runtime cost', '', 'Head `'+head+'`; observation: '+report['status']+'.', '', '| Job | Seconds | Result |', '|---|---:|---|']
          for run in runs:
              for job in run['jobs']:
                  lines.append(f"| {job['name']} | {job['seconds']} | {job['conclusion']} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('\n'.join(lines)+'\n')
          print(json.dumps({'status':report['status'],'trigger':report['trigger'],'runs':[{'id':r['id'],'jobs':r['jobs']} for r in runs]}))
          PY
      - name: Preserve completed cost readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-cost-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/quality-cost.json
          if-no-files-found: error
          retention-days: 30
